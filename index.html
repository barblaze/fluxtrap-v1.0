<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#00ffcc">
<meta name="description" content="FLUXTRAP v1.0 - A masocore platformer where nothing is fair and everything kills you.">
<title>FLUXTRAP v1.0</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap');
:root{--c:#00ffcc;--m:#ff00aa;--w:#ffffff;--bg:#04060f;--hud:#080c18;--y:#ffe040;--r:#ff3040;--dim:#0a1020;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);--g:#44ffaa;--p:#aa44ff;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Share Tech Mono',monospace;touch-action:none;user-select:none;color:#eee}
#root{display:flex;flex-direction:column;width:100%;height:100%}
/* HUD */
#hud-top{background:var(--hud);border-bottom:1px solid #0f2030;padding:5px 12px;padding-top:calc(var(--st)+5px);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:4px}
#arena{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;min-height:0;background:var(--bg)}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#ctrl-bar{background:var(--hud);border-top:1px solid #0f2030;padding:8px 16px;padding-bottom:calc(8px + var(--sb));display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
@media(hover:hover)and(pointer:fine){#ctrl-bar{display:none}#hud-top{padding-bottom:8px}}
.hud-grp{display:flex;flex-direction:column;align-items:center;gap:1px}
.hud-lbl{font-size:8px;color:#335;letter-spacing:2px;text-transform:uppercase}
.hud-val{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;color:var(--c)}
#h-lvl .hud-val{color:var(--m)}
#h-deaths .hud-val{color:var(--r)}
#h-msg{font-family:'Orbitron',monospace;font-size:11px;font-weight:700;color:var(--y);letter-spacing:1px;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s}
#h-msg.show{opacity:1}
.btn-grp{display:flex;gap:6px}
.menu-btn{border-radius:4px;background:#080c18;border:1px solid #1a2a3a;color:#557;font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:1px;padding:4px 8px;cursor:pointer;transition:all .08s}
.menu-btn:active,.menu-btn:hover{background:#0a2030;border-color:var(--c);color:var(--c);box-shadow:0 0 6px var(--c)}
.ctrl-btn{border-radius:8px;background:#080c18;border:1px solid #1a2a3a;color:#557;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:1px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .08s;flex-shrink:0}
.ctrl-btn:active,.ctrl-btn.pressed{background:#0a2030;border-color:var(--c);color:var(--c);box-shadow:0 0 8px var(--c)}
.dir-btn{width:52px;height:52px;font-size:18px}
#btn-pause{font-size:14px;width:44px;height:44px}
/* Overlay */
#overlay{position:absolute;inset:0;z-index:20;background:rgba(4,6,15,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .3s}
#overlay.off{opacity:0;pointer-events:none}
#ov-pre{font-size:10px;color:#335;letter-spacing:4px;text-transform:uppercase}
#ov-title{font-family:'Orbitron',monospace;font-weight:900;font-size:clamp(28px,7vw,52px);color:var(--c);text-shadow:0 0 30px var(--c),0 0 60px var(--c);letter-spacing:4px;text-align:center;line-height:1}
#ov-sub{font-size:12px;color:#556;letter-spacing:3px;text-align:center}
#ov-tip{font-size:11px;color:var(--y);letter-spacing:1px;text-align:center;padding:8px 16px;border:1px solid #221a00;border-radius:4px;background:#0a0800;max-width:280px;line-height:1.7}
.ov-btn{font-family:'Orbitron',monospace;font-weight:700;font-size:13px;letter-spacing:3px;cursor:pointer;border:none;padding:12px 32px;background:var(--c);color:#000;clip-path:polygon(8px 0%,calc(100% - 8px) 0%,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0% calc(100% - 8px),0% 8px);transition:background .1s;margin-top:4px}
.ov-btn:active,.ov-btn:hover{background:#fff}
.ov-btn.alt{background:var(--m);color:#000}
#arena::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.08) 2px,rgba(0,0,0,.08) 4px);pointer-events:none;z-index:1}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,4px)}}

/* ========== PANELS ========== */
.panel{position:absolute;inset:0;z-index:30;background:rgba(4,6,15,.97);display:flex;flex-direction:column;transition:opacity .2s;overflow-y:auto}
.panel-hidden{display:none!important}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:calc(var(--st)+12px);border-bottom:1px solid #0f2030;flex-shrink:0}
.panel-title{font-family:'Orbitron',monospace;font-size:16px;font-weight:700;color:var(--c);letter-spacing:2px}
.panel-close{background:none;border:1px solid #335;color:#557;font-size:16px;width:36px;height:36px;border-radius:4px;cursor:pointer;font-family:'Share Tech Mono',monospace}
.panel-close:hover,.panel-close:active{border-color:var(--r);color:var(--r)}
.panel-body{flex:1;padding:12px 16px;overflow-y:auto}

/* Profile */
.p-head{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.p-av{width:56px;height:56px;border-radius:8px;border:2px solid var(--c);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.p-info{display:flex;flex-direction:column;gap:2px}
.p-name{font-family:'Orbitron',monospace;font-size:18px;font-weight:700;color:var(--c)}
.p-skin{font-size:11px;color:#558}
.p-lvl{font-size:13px;color:var(--m);font-weight:700}
.p-xp-bg{height:8px;background:#0a1020;border-radius:4px;margin:8px 0;overflow:hidden}
.p-xp-fill{height:100%;background:linear-gradient(90deg,var(--c),var(--m));border-radius:4px;transition:width .3s}
.p-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.p-grid>div{background:#080c18;border:1px solid #0f2030;border-radius:6px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:2px}
.p-v{font-family:'Orbitron',monospace;font-size:18px;font-weight:700;color:var(--c)}
.p-l{font-size:8px;color:#446;letter-spacing:2px}

/* Shop */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.si{background:#080c18;border:1px solid #0f2030;border-radius:8px;padding:12px;text-align:center;cursor:pointer;transition:all .1s}
.si:active,.si:hover{border-color:var(--c)}
.si.ow{border-color:#1a3a2a}
.si.eq{border-color:var(--c);box-shadow:0 0 8px var(--c)}
.sp{width:48px;height:48px;border-radius:6px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid rgba(255,255,255,.1)}
.sn{font-size:11px;color:#889;letter-spacing:2px;font-weight:700}
.sp2{font-size:10px;color:var(--y);margin-top:4px}
.si.ow .sp2{color:var(--g)}
.si.eq .sp2{color:var(--c)}

/* Challenges */
.cc{background:#080c18;border:1px solid #0f2030;border-radius:8px;padding:12px;margin-bottom:8px}
.ct{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;color:var(--c)}
.cd{font-size:11px;color:#667;margin:4px 0}
.cr{font-size:10px;color:var(--y)}
.cs{font-size:10px;color:#446;margin-top:4px}
.cc.d{border-color:#1a3a2a;opacity:.6}
.cc.d .cs{color:var(--g)}
.streak{background:#080c18;border:1px solid #0f2030;border-radius:8px;padding:12px;margin-top:8px;text-align:center}
.st-title{font-size:10px;color:#446;letter-spacing:3px}
.st-count{font-family:'Orbitron',monospace;font-size:22px;font-weight:700;color:var(--y);margin:4px 0}
.st-bar{display:flex;gap:4px;justify-content:center}
.st-dot{width:20px;height:20px;border-radius:50%;background:#0a1020;border:1px solid #1a2a3a}
.st-dot.act{background:var(--y);border-color:var(--y);box-shadow:0 0 6px var(--y)}

/* Leaderboard */
.lb-h{font-family:'Orbitron',monospace;font-size:14px;font-weight:700;color:var(--m);text-align:center;margin-bottom:8px}
.lb-c{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px}
.lb-b{background:#080c18;border:1px solid #1a2a3a;color:var(--c);padding:4px 12px;border-radius:4px;cursor:pointer;font-family:'Share Tech Mono',monospace}
.lb-b:hover,.lb-b:active{border-color:var(--c)}
.lb-l{display:flex;flex-direction:column;gap:4px}
.lb-e2{background:#080c18;border:1px solid #0f2030;border-left:3px solid #335;border-radius:4px;padding:8px 12px;display:flex;align-items:center;gap:8px}
.lb-r{font-family:'Orbitron',monospace;font-size:14px;font-weight:700;min-width:28px}
.lb-n2{flex:1;font-size:12px;color:#889}
.lb-s{font-size:10px;color:#446}
.lb-e{text-align:center;color:#335;font-size:12px;padding:20px}

/* Stats */
.sr{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #0a1020;font-size:12px}
.sr span:last-child{color:var(--c);font-family:'Orbitron',monospace;font-weight:700}

/* Achievements */
.ag{display:flex;flex-direction:column;gap:6px}
.ai{background:#080c18;border:1px solid #0f2030;border-radius:6px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.ai-n{font-size:12px;font-weight:700;color:#889;flex:1}
.ai-d{font-size:10px;color:#446;display:none}
.ai-x{font-size:10px;color:var(--y);font-weight:700}
.ai.u{border-color:#1a3a2a}
.ai.u .ai-n{color:var(--g)}
.ai.u .ai-x{color:var(--g)}
</style>
</head>
<body>
<div id="root">
  <div id="hud-top">
    <div class="hud-grp" id="h-lvl"><div class="hud-lbl">ZONE</div><div class="hud-val" id="hv-lvl">01</div></div>
    <div id="h-msg"></div>
    <div class="hud-grp" id="h-deaths"><div class="hud-lbl">DEATHS</div><div class="hud-val" id="hv-deaths">0</div></div>
    <button class="ctrl-btn" id="btn-pause" onclick="window._game && window._game._togglePause()">II</button>
  </div>

  <div id="arena">
    <div id="js-dot" style="position:fixed;top:4px;left:4px;width:8px;height:8px;border-radius:50%;background:red;z-index:9999;transition:background.3s"></div>
  <div id="debug-status" style="position:fixed;top:20px;left:4px;background:#000;color:#0f0;padding:4px 8px;font-size:10px;font-family:monospace;z-index:9999;max-width:200px;word-break:break-all;">INIT...</div>
    <canvas id="c"></canvas>

    <div id="overlay">
      <div id="ov-pre">WELCOME TO</div>
      <div id="ov-title">FLUXTRAP</div>
      <div id="ov-sub">v1.0 - NOTHING IS FAIR</div>
      <div id="ov-tip">
        ARROWS / WASD TO MOVE - SPACE/UP TO JUMP<br>
        Reach the <span style="color:var(--c)">EXIT</span> if it lets you.<br>
        <span style="color:var(--g);font-size:9px">PRESS ESC TO ACCESS MENU</span>
      </div>
      <button class="ov-btn" id="ov-start" onclick="startGameClick()">START SUFFERING</button>
    </div>

    <!-- Profile Panel -->
    <div class="panel panel-hidden" id="panel-profile">
      <div class="panel-header"><div class="panel-title">PROFILE</div><button class="panel-close" onclick="hidePanel()">X</button></div>
      <div class="panel-body" id="panel-profile-content"></div>
    </div>

    <!-- Shop Panel -->
    <div class="panel panel-hidden" id="panel-shop">
      <div class="panel-header"><div class="panel-title">SHOP</div><button class="panel-close" onclick="hidePanel()">X</button></div>
      <div class="panel-body" id="panel-shop-content"></div>
    </div>

    <!-- Challenges Panel -->
    <div class="panel panel-hidden" id="panel-challenges">
      <div class="panel-header"><div class="panel-title">CHALLENGES</div><button class="panel-close" onclick="hidePanel()">X</button></div>
      <div class="panel-body" id="panel-challenges-content"></div>
    </div>

    <!-- Leaderboard Panel -->
    <div class="panel panel-hidden" id="panel-leaderboard">
      <div class="panel-header"><div class="panel-title">LEADERBOARD</div><button class="panel-close" onclick="hidePanel()">X</button></div>
      <div class="panel-body" id="panel-lb-content"></div>
    </div>

    <!-- Stats Panel -->
    <div class="panel panel-hidden" id="panel-stats">
      <div class="panel-header"><div class="panel-title">STATS</div><button class="panel-close" onclick="hidePanel()">X</button></div>
      <div class="panel-body" id="panel-stats-content"></div>
    </div>

    <!-- Achievements Panel -->
    <div class="panel panel-hidden" id="panel-achievements">
      <div class="panel-header"><div class="panel-title">ACHIEVEMENTS</div><button class="panel-close" onclick="hidePanel()">X</button></div>
      <div class="panel-body" id="panel-achievements-content"></div>
    </div>
  </div>

  <div id="ctrl-bar">
    <div class="btn-grp">
      <button class="menu-btn" id="btn-menu-profile" onclick="showPanel('profile')">PROFILE</button>
      <button class="menu-btn" id="btn-menu-shop" onclick="showPanel('shop')">SHOP</button>
      <button class="menu-btn" id="btn-menu-challenges" onclick="showPanel('challenges')">DAILY</button>
    </div>
    <div class="btn-grp">
      <button class="menu-btn" id="btn-menu-leaderboard" onclick="showPanel('leaderboard')">RANK</button>
      <button class="menu-btn" id="btn-menu-stats" onclick="showPanel('stats')">STATS</button>
      <button class="menu-btn" id="btn-menu-achievements" onclick="showPanel('achievements')">ACHIEVE</button>
    </div>
  </div>

  <div id="ctrl-bar-bottom" style="background:var(--hud);border-top:1px solid #0f2030;padding:6px 16px;padding-bottom:calc(6px + var(--sb));display:flex;align-items:center;justify-content:space-between;flex-shrink:0">
    <div class="btn-grp">
      <div class="ctrl-btn dir-btn" id="btn-l"><</div>
      <div id="dpad-mid"></div>
      <div class="ctrl-btn dir-btn" id="btn-r">></div>
    </div>
    <div class="btn-grp">
      <div class="ctrl-btn act-btn" id="btn-jump">JUMP</div>
    </div>
  </div>
</div>

<script src="./game_simple.js"></script>
</body>
</html>
